<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Explorers 🌙</title>
  <link rel="stylesheet" href="./styled/style.css">
</head>
<body>
  <div id="game">
    <div class="topbar">
      <div class="logo">🌙 Little Explorers</div>
      <div class="badge">✨ Learn • Explore • Grow</div>
    </div>

    <div id="welcome" class="welcome">
      <div class="welcome-card">
        <div class="moon">🌙</div>
        <h1>Welcome, Explorer!</h1>
        <p>Discover a little world full of kindness, learning and adventure.</p>
        <button id="startButton">Let's Explore! 🌷</button>
      </div>
    </div>

    <div class="hint">⌨️ Move with WASD or arrow keys</div>

    <div class="bottom-menu">
      <button data-action="explore">🧭 <span>Explore</span></button>
      <button data-action="learn">📖 <span>Learn</span></button>
      <button data-action="duas">🤲 <span>Duas</span></button>
      <button data-action="stories">📚 <span>Stories</span></button>
    </div>

    <div id="message" role="status"></div>
  </div>

  <script type="module" src="./script/script.js"></script>
</body>
</html>
